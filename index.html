<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adham Platform</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  text-align:center;
  font-family:Arial;
}

/* نيون متحرك */
@keyframes glow{
  0%{text-shadow:0 0 10px #00f7ff;}
  50%{text-shadow:0 0 25px #00f7ff;}
  100%{text-shadow:0 0 10px #00f7ff;}
}

.glow{
  animation:glow 2s infinite;
}

/* تسجيل الدخول */
#login{
  margin-top:150px;
}

input{
  padding:12px;
  margin:10px;
  width:70%;
  border:none;
  border-radius:10px;
}

.login-btn{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#00f7ff;
  color:black;
  cursor:pointer;
}

/* الصفحة */
#home{display:none;}

.gallery{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}

.gallery img{
  width:90px;
  border-radius:15px;
  box-shadow:0 0 15px #00f7ff;
}

/* الأزرار */
.btn{
  display:block;
  width:85%;
  margin:12px auto;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:16px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.b1{background:#0ea5e9;}
.b2{background:#ef4444;}
.b3{background:#8b5cf6;}
.b4{background:#06b6d4;}
.b5{background:#22c55e;}

.btn:hover{
  transform:scale(1.05);
}

/* البوكس */
.box{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:85%;
  margin:auto;
}

/* واتساب */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
}

/* الإحصائيات */
.stats{
  margin-top:20px;
}
</style>
</head>

<body>

<!-- تسجيل دخول -->
<div id="login">
  <h2 class="glow">🔐 تسجيل الدخول</h2>
  <input type="text" id="user" placeholder="اسم المستخدم">
  <br>
  <input type="password" id="pass" placeholder="كلمة المرور">
  <br>
  <button class="login-btn" onclick="login()">دخول</button>
</div>

<!-- الصفحة -->
<div id="home">

<h2 class="glow">🚀 منصة المطور أدهم</h2>

<div class="gallery">
  <img src="https://picsum.photos/200?1">
  <img src="https://picsum.photos/200?2">
  <img src="https://picsum.photos/200?3">
</div>

<p>『★』𝘿𝙚𝙫𝙚𝙡𝙤𝙥𝙚𝙧 𝘼𝙙𝙝𝙖𝙢『★』</p>

<button class="btn b1" onclick="show('bots')">🤖 بوتات واتس</button>
<div class="box" id="bots">
  <button class="btn b4" onclick="openLink('https://chat.whatsapp.com/KC8Q6P7Z9RI25uGYHMMMV3')">جروب 1</button>
  <button class="btn b4" onclick="openLink('https://chat.whatsapp.com/K5oCXsm3AvuLezbArdHOa2')">جروب 2</button>
</div>

<button class="btn b2" onclick="show('crash')">💀 بوتات كراش</button>
<div class="box" id="crash">
  <button class="btn b2" onclick="openLink('https://t.me/hfggbjbot')">كراش 1</button>
  <button class="btn b2" onclick="openLink('https://t.me/GAZARA_B_BOT')">كراش 2</button>
  <button class="btn b2" onclick="openLink('https://t.me/A_d_h_a_m3bot')">كراش 3</button>
</div>

<button class="btn b3" onclick="show('channels')">📺 القنوات</button>
<div class="box" id="channels">
  <button class="btn b3" onclick="openLink('https://whatsapp.com/channel/0029VbCkwWWEAKWKOCl2Os3E')">واتس 1</button>
  <button class="btn b3" onclick="openLink('https://whatsapp.com/channel/0029VbBk7J059PwUGXv60o16')">واتس 2</button>
  <button class="btn b3" onclick="openLink('https://t.me/D_l_L_s_k_H_6')">تيليجرام</button>
</div>

<button class="btn b4" onclick="show('prices')">💰 الأسعار</button>
<div class="box" id="prices">
  <p>🔥 منصة 32 RAM: 600 جنيه</p>
  <p>🤖 بوتات: 200 - 450</p>
  <p>💻 سيرفر: 30 - 70</p>
</div>

<button class="btn b5" onclick="show('devbox')">👨‍💻 المطور</button>
<div class="box" id="devbox">
  <button class="btn b5" onclick="openLink('https://wa.me/201014962157')">شراء</button>
</div>

<img class="whatsapp" src="https://cdn-icons-png.flaticon.com/512/733/733585.png"
onclick="openLink('https://wa.me/201014962157')">

<div class="stats">
👥 المستخدمين: <span id="users">0</span><br>
📊 العمليات: <span id="ops">0</span>
</div>

</div>

<script>

/* تسجيل دخول وهمي */
function login(){
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";
}

/* إظهار الأقسام */
function show(id){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.getElementById(id).style.display='block';
}

/* فتح روابط */
function openLink(link){
  window.open(link);
}

/* عداد وهمي */
let users=1000;
let ops=3000;

setInterval(()=>{
  users+=Math.floor(Math.random()*3);
  ops+=Math.floor(Math.random()*5);

  document.getElementById("users").innerText=users;
  document.getElementById("ops").innerText=ops;
},2000);

</script>

</body>
</html>
