<style>
body{
  margin:0;
  background:#020617;
  color:white;
  text-align:center;
  font-family:Arial;
}

/* نيون */
@keyframes glow{
  0%{text-shadow:0 0 10px #00f7ff;}
  50%{text-shadow:0 0 30px #00f7ff;}
  100%{text-shadow:0 0 10px #00f7ff;}
}

.glow{
  animation:glow 2s infinite;
}

/* تسجيل */
#login{
  margin-top:180px;
}

.login-btn{
  padding:15px 25px;
  border:none;
  border-radius:12px;
  background:#00f7ff;
  color:black;
  font-size:18px;
  cursor:pointer;
}

/* الصفحة */
#home{display:none;}

/* صور */
.gallery{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:30px;
}

.gallery img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 0 25px #00f7ff;
}

/* أزرار */
.btn{
  display:block;
  width:85%;
  margin:25px auto;
  padding:16px;
  border:none;
  border-radius:15px;
  font-size:17px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.b1{background:#0ea5e9;}
.b2{background:#ef4444;}
.b3{background:#8b5cf6;}
.b4{background:#06b6d4;}
.b5{background:#22c55e;}

.btn:hover{
  transform:scale(1.08);
}

/* البوكس */
.box{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:85%;
  margin:auto;
}

/* واتساب */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
}

/* احصائيات */
.stats{
  margin-top:30px;
  font-size:18px;
}
</style>
</head>

<body>

<!-- تسجيل -->
<div id="login">

  <button class="login-btn" onclick="login()">🚀 دخول المنصة</button>

<button class="btn b3" onclick="show('channels')">📺 القنوات</button>

<script>

function login(){
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";
}

function show(id){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.getElementById(id).style.display='block';
}

function openLink(link){
  window.open(link);
}

let users=2000;
let ops=5000;

setInterval(()=>{
  users+=Math.floor(Math.random()*6);
  ops+=Math.floor(Math.random()*8);

  document.getElementById("users").innerText=users;
  document.getElementById("ops").innerText=ops;
},2000);

</script>
