<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adham Platform</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  text-align:center;
  font-family:Arial;
}

/* نيون */
@keyframes glow{
  0%{text-shadow:0 0 10px #00f7ff;}
  50%{text-shadow:0 0 25px #00f7ff;}
  100%{text-shadow:0 0 10px #00f7ff;}
}

.glow{
  animation:glow 2s infinite;
}

/* تسجيل */
#login{
  margin-top:150px;
}

input{
  padding:12px;
  margin:10px;
  width:70%;
  border:none;
  border-radius:10px;
}

.login-btn{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#00f7ff;
  color:black;
  cursor:pointer;
}

/* الصفحة */
#home{display:none;}

/* صور */
.gallery{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:25px;
}

.gallery img{
  width:95px;
  height:95px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 0 20px #00f7ff;
}

/* أزرار */
.btn{
  display:block;
  width:85%;
  margin:18px auto;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:16px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.b1{background:#0ea5e9;}
.b2{background:#ef4444;}
.b3{background:#8b5cf6;}
.b4{background:#06b6d4;}
.b5{background:#22c55e;}

.btn:hover{
  transform:scale(1.06);
}

/* البوكس */
.box{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:85%;
  margin:auto;
}

/* واتساب */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
}

/* احصائيات */
.stats{
  margin-top:25px;
  font-size:18px;
}
</style>
</head>

<body>

<!-- تسجيل -->
<div id="login">
  <h2 class="glow">🔐 𝑳𝒐𝒈𝒊𝒏 𝑺𝒚𝒔𝒕𝒆𝒎</h2>
  <input type="text" placeholder="اسم المستخدم">
  <br>
  <input type="password" placeholder="كلمة المرور">
  <br>
  <button class="login-btn" onclick="login()">دخول</button>
</div>

<!-- الصفحة -->
<div id="home">

<h2 class="glow">🚀 『★』𝑨𝒅𝒉𝒂𝒎 𝑷𝒍𝒂𝒕𝒇𝒐𝒓𝒎『★』</h2>

<p>⚡ افضل منصة بوتات و سيرفرات ⚡</p>

<div class="gallery">
  <!-- بوتات -->
  <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">
  
  <!-- انمي -->
  <img src="https://i.imgur.com/3ZQ3Z4B.jpeg">
  
  <!-- سيرفر -->
  <img src="https://cdn-icons-png.flaticon.com/512/4248/4248443.png">
</div>

<p>『★』𝘿𝙚𝙫𝙚𝙡𝙤𝙥𝙚𝙧 𝘼𝙙𝙝𝙖𝙢『★』</p>

<button class="btn b1" onclick="show('bots')">🤖 بوتات واتس</button>
<div class="box" id="bots">
  <button class="btn b4" onclick="openLink('https://chat.whatsapp.com/KC8Q6P7Z9RI25uGYHMMMV3')">جروب 1</button>
  <button class="btn b4" onclick="openLink('https://chat.whatsapp.com/K5oCXsm3AvuLezbArdHOa2')">جروب 2</button>
</div>

<button class="btn b2" onclick="show('crash')">💀 بوتات كراش</button>
<div class="box" id="crash">
  <button class="btn b2" onclick="openLink('https://t.me/hfggbjbot')">كراش 1</button>
  <button class="btn b2" onclick="openLink('https://t.me/GAZARA_B_BOT')">كراش 2</button>
</div>

<button class="btn b3" onclick="show('channels')">📺 القنوات</button>
<div class="box" id="channels">
  <button class="btn b3" onclick="openLink('https://whatsapp.com/channel/0029VbCkwWWEAKWKOCl2Os3E')">واتس</button>
  <button class="btn b3" onclick="openLink('https://t.me/D_l_L_s_k_H_6')">تيليجرام</button>
</div>

<button class="btn b4" onclick="show('prices')">💰 الأسعار</button>
<div class="box" id="prices">
  <p>🔥 منصة 32 RAM: 600 جنيه</p>
  <p>🤖 بوتات: 200 - 450</p>
  <p>💻 سيرفر: 30 - 70</p>
</div>

<button class="btn b5" onclick="show('devbox')">👨‍💻 المطور</button>
<div class="box" id="devbox">
  <button class="btn b5" onclick="openLink('https://wa.me/201014962157')">شراء</button>
</div>

<img class="whatsapp" src="https://cdn-icons-png.flaticon.com/512/733/733585.png"
onclick="openLink('https://wa.me/201014962157')">

<div class="stats">
👥 المستخدمين: <span id="users">0</span><br>
📊 العمليات: <span id="ops">0</span>
</div>

</div>

<script>

/* تسجيل */
function login(){
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";
}

/* عرض */
function show(id){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.getElementById(id).style.display='block';
}

/* روابط */
function openLink(link){
  window.open(link);
}

/* عداد */
let users=1200;
let ops=3500;

setInterval(()=>{
  users+=Math.floor(Math.random()*4);
  ops+=Math.floor(Math.random()*6);

  document.getElementById("users").innerText=users;
  document.getElementById("ops").innerText=ops;
},2000);

</script>

</body>
</html>
