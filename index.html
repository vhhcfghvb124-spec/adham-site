<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adham Platform</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#020617,#020617,#0f172a);
  color:white;
  text-align:center;
  font-family:Arial;
}

/* نيون */
.glow{
  text-shadow:0 0 10px #00f7ff,0 0 25px #00f7ff;
}

/* الصور */
.triangle{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:30px;
}

.triangle img{
  width:90px;
  height:90px;
  border-radius:15px;
  box-shadow:0 0 15px #00f7ff;
}

/* النص */
.dev{
  margin-top:15px;
  font-size:18px;
}

/* الأزرار */
.btn{
  display:block;
  width:85%;
  margin:12px auto;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:16px;
  background:linear-gradient(45deg,#0ea5e9,#22c55e);
  color:white;
  box-shadow:0 0 15px #00f7ff;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px #00f7ff;
}

/* البوكس */
.box{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:85%;
  margin:auto;
  box-shadow:0 0 20px #00f7ff;
}

/* واتساب */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
}

/* الفوتر */
.footer{
  font-size:13px;
  margin-top:30px;
  color:#aaa;
}
</style>
</head>

<body>

<h2 class="glow">بسم الله الرحمن الرحيم</h2>
<p class="glow">يا رب الموقع يكون قد الثقة 💙</p>

<div class="triangle">
  <img src="https://picsum.photos/200?1">
  <img src="https://picsum.photos/200?2">
  <img src="https://picsum.photos/200?3">
</div>

<p class="dev">『★』𝘿𝙚𝙫𝙚𝙡𝙤𝙥𝙚𝙧 𝘼𝙙𝙝𝙖𝙢『★』</p>

<button class="btn" onclick="show('bots')">🤖 بوتات واتس</button>
<div class="box" id="bots">
  <button class="btn" onclick="openLink('https://chat.whatsapp.com/KC8Q6P7Z9RI25uGYHMMMV3')">جروب 1</button>
  <button class="btn" onclick="openLink('https://chat.whatsapp.com/K5oCXsm3AvuLezbArdHOa2')">جروب 2</button>
</div>

<button class="btn" onclick="show('crash')">💀 بوتات كراش</button>
<div class="box" id="crash">
  <button class="btn" onclick="openLink('https://t.me/hfggbjbot')">كراش 1</button>
  <button class="btn" onclick="openLink('https://t.me/GAZARA_B_BOT')">كراش 2</button>
  <button class="btn" onclick="openLink('https://t.me/A_d_h_a_m3bot')">كراش 3</button>
</div>

<button class="btn" onclick="show('channels')">📺 القنوات</button>
<div class="box" id="channels">
  <button class="btn" onclick="openLink('https://whatsapp.com/channel/0029VbCkwWWEAKWKOCl2Os3E')">واتس 1</button>
  <button class="btn" onclick="openLink('https://whatsapp.com/channel/0029VbBk7J059PwUGXv60o16')">واتس 2</button>
  <button class="btn" onclick="openLink('https://t.me/D_l_L_s_k_H_6')">تيليجرام</button>
</div>

<button class="btn" onclick="show('prices')">💰 الأسعار</button>
<div class="box" id="prices">
  <p>منصة 32 رام: 600 جنيه</p>
  <p>بوتات: 200 - 450 جنيه</p>
  <p>سيرفر محدد: 30 - 70</p>
  <p>غير محدد: 80</p>
</div>

<button class="btn" onclick="show('devbox')">👨‍💻 المطور</button>
<div class="box" id="devbox">
  <button class="btn" onclick="openLink('https://wa.me/201014962157')">شراء</button>
  <button class="btn" onclick="openLink('https://wa.me/201090656418')">استفسار</button>
  <button class="btn" onclick="openLink('https://t.me/amom12358')">تيليجرام</button>
  <button class="btn" onclick="openLink('https://wa.me/201551179084')">احتياطي</button>
</div>

<img class="whatsapp" src="https://cdn-icons-png.flaticon.com/512/733/733585.png"
onclick="openLink('https://wa.me/201014962157')">

<div class="footer">
❤️ تم الإنشاء بواسطة المطور أدهم<br>
موقع احترافي لبيع البوتات والسيرفرات
</div>

<script>
function show(id){
  document.querySelectorAll('.box').forEach(b=>b.style.display='none');
  document.getElementById(id).style.display='block';
}
function openLink(link){
  window.open(link);
}
</script>

</body>
</html>
